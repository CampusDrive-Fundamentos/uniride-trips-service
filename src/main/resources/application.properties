# ===============================
# SERVER CONFIGURATION
# ===============================
spring.application.name=uniride-trips-service
server.port=8085

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/uniride_db
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SECURITY CONFIGURATION (JWT)
# ===============================
jwt.secret=ThisIsASecretKeyForCampusDriveAppThatMustBeVeryLongAndSecure

# ===============================
# INTEGRATION CONFIGURATION
# ===============================
finance.service.url=http://localhost:8084/api/v1/finance

# Actuator configuration
management.endpoints.web.exposure.include=health
